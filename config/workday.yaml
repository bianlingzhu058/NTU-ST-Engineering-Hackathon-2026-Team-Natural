# Workday mode: the bot writes its own to do list, works through it and updates it.
# A range operator can change everything here without touching code: the tasks the bot may put on
# its list (and how it words them), the sites, where files go, and the switches for Writer features
# that still need a check on the VM. Behaviour numbers (typing, breaks, rates) live in
# agent/behaviour/params.py with their sources; print them with: python -m agent rules

files:
  todo_folder: 'Documents\To do'      # under the user's profile; the bot makes it on its first run
  work_folder: 'Documents'            # where task files (notes, sheets) are saved
  # How the bot creates the To do folder the first time: "explorer" (Win+E, Ctrl+Shift+N),
  # or "none" (save the list straight into Documents).
  make_folder: explorer

todo:
  title: ["todo {date}", "to do {date}", "To do {day} {date}", "todo for {day}"]
  file: "todo {date}"
  # How a done item gets crossed out. "dialog" = select the item text, Format > Character, Font
  # Effects, Strikethrough (needs the VM check, keys below). "note" = no strikethrough, the note
  # starts with "done". Kellyn's design: strikethrough if Writer allows it by keyboard, else a note.
  strike: note
  strike_keys: ["alt+o", "h", "WAIT", "ctrl+pagedown", "alt+s", "down", "enter"]
  strike_dialog_title: "Character"

# Lines on the to do list and in note lists. dash: none = plain lines; literal = "- " typed on every
# line. Use literal only if Writer leaves "- " as typed (VM test: type "- test" + Enter in Writer; if it
# turns into a bullet, switch off Tools > AutoCorrect > Options > Bulleted and numbered lists first).
# plan.first_task: the first line of every list is this task (demo). crypto_prices = CoinGecko into Calc:
# Edge and Calc side by side, numbers copied (Ctrl+C, Ctrl+V) or read and typed. Remove the line for a random first task.
plan:
  first_task: crypto_prices

lists:
  dash: none
  # Notes: copy items off the page (select, Ctrl+C, Ctrl+Alt+Shift+V paste as plain text) instead of
  # typing them. off until checked on the VM. check: whole = copy whole page elements only (the bot
  # knows the text); clipboard = rough partial selection, then the bot reads what was copied.
  copy: off
  copy_check: whole

apps:
  # search: what a person types in Start search; one is picked each time. Best match checked on VM 2
  # (25 Oct): wr -> OpenOffice Writer, calc -> OpenOffice Calc, edge -> Edge Test. Edge always gets at
  # least "edge t": plain "edge" could become Microsoft Edge (no cert flag) once Windows reorders it.
  browser: {search: ["edge t", "edge te", "edge test"], title: "Edge"}
  writer: {search: ["wr", "writ", "writer"], title: "Writer"}
  calc: {search: ["calc"], title: "Calc"}

# Items the bot may put on its list. kind: hybrid (web then Writer/Calc), websurf, office, explorer.
# labels are casual wordings; {coin} and {person} are filled in at random. Each line on a list is
# unique. Everything a task takes from a website is read off the page at that moment (agent/day/eyes.py).
# min_minutes: the item only goes on lists of runs at least that long.
# Left out on purpose (24 Oct dumps): arstechnica, aliexpress, binance,
# cloudflare (blocked on the range), coinmarketcap, bleacherreport (broken), apple, asus, cnet (unreadable).
# cnn is in again (25 Oct): the eyes click its 'Agree' pop-up. booking is blocked too: kept as one "rare" line so a run now and then shows an honest failure.
items:
  # Hybrid: read the site, then work with what it shows (read off the page live by the eyes)
  - {task: crypto_prices, kind: hybrid, site: "https://coingecko.com", file: ["crypto prices {date}", "coins {date}", "crypto {date}"], labels: ["check {coin} on coingecko", "coingecko prices for {coin}", "update crypto sheet from coingecko", "look up {coin} price on coingecko"]}
  - {task: crypto_compare, kind: hybrid, site: "https://www.coinbase.com", labels: ["compare {coin} coingecko vs coinbase", "{coin} in sgd vs usd", "check sgd crypto prices on coinbase"]}
  - {task: read_note, kind: hybrid, recipe: news, sites: ["https://apnews.com", "https://www.bbc.com"], find: ["World Cup", "NATO", "business"], labels: ["news notes for the team", "news round up for {person}", "write up todays headlines"]}
  - {task: read_note, kind: hybrid, recipe: training, sites: ["https://www.coursera.org"], find: ["Python", "Excel", "Machine Learning"], labels: ["training ideas for {person}", "find a course for {person} on coursera", "coursera options for the team"]}
  - {task: read_note, kind: hybrid, recipe: cloud, sites: ["https://aws.amazon.com", "https://cloud.google.com"], find: ["free", "AI"], labels: ["compare aws vs google cloud", "cloud options for the new project"]}
  - {task: read_note, kind: hybrid, recipe: phone, sites: ["https://www.samsung.com"], find: ["Galaxy"], labels: ["phone options for {person}", "samsung phone for {person}"]}
  - {task: read_note, kind: hybrid, recipe: asana, sites: ["https://www.asana.com"], find: ["AI", "teams"], labels: ["look at asana for team tasks", "asana for our project?"]}
  - {task: laptop_compare, kind: hybrid, site: "https://www.dell.com", min_minutes: 10, labels: ["compare dell laptops", "dell laptop options for the team", "look at dell laptops"]}
  # Websurf: each line asks for one thing ([line, word, goal, answer word]; words from the VM page dumps, 25 Oct). The bot
  # Ctrl+F's the word; done only when the goal is reached (Kellyn): read = a sentence with the word AND the
  # answer word is on the page (news lines: any headline with the word), its gist goes on the list; open = the word's link opens a page with something new on it, else
  # "<word> page down, try again later". Sub pages are 404 on the range, so only archive contact is "open":
  # one honest failure now and then. amazon, arxiv and other link-only lines were dropped for that reason.
  - {task: browse, kind: websurf, site: "https://www.coursera.org", labels: [["coursera plus discount?", "Save 40%", "read", "40%"]]}
  - {task: browse, kind: websurf, site: "https://apnews.com", labels: [["world cup news on ap", "World Cup", "read"], ["ap tech news", "Technology", "read"]]}
  - {task: browse, kind: websurf, site: "https://www.bbc.com", labels: [["bbc world cup news", "World Cup", "read"]]}
  - {task: browse, kind: websurf, site: "https://www.cnn.com", labels: [["check cnn for the nato news", "NATO", "read"]]}
  - {task: browse, kind: websurf, site: "https://www.coinbase.com", labels: [["what is xsgd on coinbase?", "XSGD", "read", "stablecoin"], ["coinbase trading fees?", "trading fees", "read", "zero"], ["who created bitcoin? coinbase page", "Bitcoin was", "read", "created by"]]}
  - {task: browse, kind: websurf, site: "https://cloud.google.com", labels: [["google cloud free tier?", "free credit", "read", "$300"]]}
  - {task: browse, kind: websurf, site: "https://www.bit.ly", labels: [["can bitly make qr codes for the event?", "QR Code", "read", "solutions"]]}
  - {task: browse, kind: websurf, site: "https://www.archive.org", labels: [["get archive.org contact details", "Contact", "open"]]}
  - {task: browse, kind: websurf, site: "https://www.booking.com", rare: true, labels: ["look at hotels for the offsite"]}
  # Office only
  - {task: writer_note, kind: office, note: meeting, labels: ["write meeting notes", "notes from the {team} meeting", "type up meeting notes"]}
  - {task: writer_note, kind: office, note: update, labels: ["weekly update", "write weekly update for {person}"]}
  - {task: writer_note, kind: office, note: email, labels: ["draft email to {person}", "reply {person} about the numbers"]}
  - {task: writer_note, kind: office, note: plan, labels: ["plan for the offsite", "rough plan for next week"]}
  - {task: calc_sheet, kind: office, sheet: budget, file: ["budget {mon}", "equipment budget"], labels: ["update budget sheet", "add costs to the budget"]}
  - {task: calc_sheet, kind: office, sheet: expenses, file: ["expenses {mon}", "claims {mon}"], labels: ["expense claims", "put in my expenses"]}
  - {task: calc_sheet, kind: office, sheet: timesheet, file: ["timesheet {date}", "hours {mon}"], labels: ["fill in timesheet", "log my hours"]}
  - {task: tidy_files, kind: explorer, labels: ["tidy up documents", "clean up my files", "sort out documents folder"]}

# Personal lines (0 to 2 per list). break: the kind of break that lets the bot strike them;
# site: the personal site visited on an on screen break (homepage only, never a login form).
personal:
  - {label: "call dentist", break: away, min_s: 120}
  - {label: "buy lunch", break: away, min_s: 240}
  - {label: "pay phone bill", break: away, min_s: 90}
  - {label: "reply {person} on bumble", break: onscreen, site: "https://www.bumble.com"}
  - {label: "check the world cup score", break: onscreen, site: "https://www.bbc.com"}
  - {label: "birthday gift for {person}", break: onscreen, site: "https://www.amazon.com"}

# Sites visited on an on screen break when no personal line needs one.
break_sites: ["https://www.bbc.com", "https://www.amazon.com", "https://apnews.com", "https://www.bumble.com"]
