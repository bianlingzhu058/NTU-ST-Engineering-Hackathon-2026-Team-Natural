# Agent settings. Behaviour numbers do NOT live here: they are in agent/behaviour/params.py, each
# with its source (print them with `python -m agent params`). The `behaviour:` section below can
# override any of them by name, for example after measuring something on the VM.

behaviour: {}
  # scroll.notch_px: 100     # measured pixels per wheel notch in Chrome on the VM

runner:
  minutes: 15
  objective: null            # null = weighted priority mix of all tasks (session.task_weights)
  stop_file: STOP_AGENT.txt  # this file next to the config folder stops the run; Ctrl+Alt+F10 creates it
  min_objective_seconds: 75  # do not start a task that cannot finish inside the budget
  max_blind_actions: 3       # consecutive actions with no expected window before the run aborts

# Window-title and process recognition. Turn enabled off to fall back to open-loop behaviour.
perception:
  enabled: true
  use_process_lookup: true   # results cached per window handle: a handful of OpenProcess calls per run

# UI Automation: link and button positions for mouse clicks. Off = keyboard fallbacks only.
uia:
  enabled: true
  max_elements: 400

# Offline simulator (dry-run, simulate, selftest). Pessimistic on purpose.
simulation:
  startup_polls: 3
  dead_link_rate: 0.25
  start_center_rate: 0.2

input:
  backend: sendinput         # sendinput (stdlib, VM runtime) or pyautogui (laptop development)

logging:
  path: logs/actions.jsonl
