# Web surfing in Chrome on the organisers' clean-TLS mock sites (technical guide, 28 Sep).
# A block of 4 to 7 minutes visits 3 to 4 sites; on each site the person reads, then makes
# 1 + Exp(3) navigation moves, each followed by reading. Numbers: agent/behaviour/params.py.
name: web_surfing
weight: 0.45
params:
  sites:
    - https://www.apple.com
    - https://www.samsung.com
    - https://www.dell.com
    - https://www.amazon.com
    - https://aws.amazon.com
    - https://apnews.com
    - https://www.coursera.org
    - https://coinmarketcap.com
    - https://www.coingecko.com
    - https://www.coinbase.com
  interests: ["price", "support", "news", "deals", "compare", "learn", "shop", "specs", "markets", "courses"]
plan:
  - skill: open_app
    args: {app: browser, name: "google chrome", taskbar_slot: 1, strategies: [taskbar, start_search], timeout: 20, attempts: 2}
  - group:
      - skill: go_to_site            # type the host, clear the warning, read the page
        args: {url: "{*sites}", timeout: 15}
      - skill: navigate              # one move from the measured mix, then read the result
        args: {interests: "{*interests}", timeout: 10}
        repeat: {exp_mean: 3, min: 0, max: 8}
        min_time_left: 75            # do not start a page that cannot be read before the session ends
    repeat: [3, 4]
    min_time_left: 70
    budget_seconds: [240, 420]
  - skill: close_browser_tabs
  - skill: close_app
    args: {app: browser, method: alt_f4, timeout: 8}
