# Web surfing on the organisers' mock sites (the clean-TLS list from the technical guide).
# One task = open the browser by a human route, visit a random number of sites in a random
# order, read each one, sometimes follow a link, then close the browser. Each site visit is a
# group so the count varies per run and the closing step always gets to run before the deadline.
name: web_surfing
weight: 3
params:
  app_name: edge
  taskbar_slot: 1
  run_command: msedge
  sites:
    - https://www.apple.com
    - https://www.samsung.com
    - https://www.dell.com
    - https://www.amazon.com
    - https://aws.amazon.com
    - https://apnews.com
    - https://www.coursera.org
    - https://coinmarketcap.com
    - https://www.coingecko.com
    - https://www.coinbase.com
  find_terms: ["price", "support", "news", "contact", "learn more", "shipping"]
plan:
  - skill: open_app
    args:
      app: browser
      name: "{app_name}"
      taskbar_slot: "{taskbar_slot}"
      run_command: "{run_command}"
      strategies: [taskbar, start_search]
      timeout: 25
      attempts: 2
  - group:
      - skill: go_to_url
        args: {url: "{sites}", new_tab_probability: 0.25, bare_host_probability: 0.45, timeout: 15}
      - skill: scroll_and_read
        args: {bursts_range: [2, 6], page_key_probability: 0.2}
      - skill: find_on_page
        chance: 0.18
        args: {text: "{find_terms}"}
      - skill: follow_link
        chance: 0.55
        args: {tabs_range: [4, 15], back_probability: 0.35, timeout: 10}
      - skill: scroll_and_read
        chance: 0.6
        args: {bursts_range: [1, 4]}
      - skill: reload_page
        chance: 0.08
    repeat: [3, 6]
    min_time_left: 70
  - skill: close_app
    args: {app: browser, method: ctrl_w, tabs: 8, timeout: 8}
