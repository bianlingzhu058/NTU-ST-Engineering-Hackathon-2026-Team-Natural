# Office worker, spreadsheet: open OpenOffice Calc, enter a small table and a SUM row, bold the
# header, save as .ods through Calc's Save As dialog, close. Row labels never start with another
# label in the same column (AutoInput would complete them).
name: office_calc
weight: 0.20
params:
  filenames: ["budget {n}", "expenses {n}", "sales summary {n}", "team costs {n}"]
  tables:
    - name: office budget
      headers: ["Item", "October", "November"]
      rows: [["Rent", "2400", "2400"], ["Utilities", "310", "285"], ["Software", "560", "560"], ["Travel", "420", "180"], ["Coffee", "95", "110"]]
      total_label: "Total"
    - name: sales
      headers: ["Region", "Q3", "Q4"]
      rows: [["North", "15200", "16850"], ["East", "9800", "11200"], ["South", "12400", "12900"], ["West", "7600", "8300"]]
      total_label: "Total"
    - name: team costs
      headers: ["Team", "Staff", "Equipment"]
      rows: [["Design", "8200", "1300"], ["Engineering", "21500", "4200"], ["Marketing", "6900", "950"], ["Support", "5400", "700"]]
      total_label: "Total"
plan:
  - skill: open_app
    args: {app: calc, name: "openoffice calc", start_center_button: "Spreadsheet", strategies: [start_search], timeout: 30, attempts: 2}
  - skill: fill_sheet
    args: {table: "{*tables}"}
  - skill: save_document
    args: {app: calc, filename: "{*filenames}"}
  - skill: close_app
    args: {app: calc, method: alt_f4, timeout: 10}
